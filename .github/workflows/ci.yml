name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Byte-compile
        run: python -m compileall -q scripts tests

      - name: CLI smoke test
        run: |
          python scripts/still.py --help
          python scripts/still.py rules
          python scripts/still.py rules --profile profiles/editorial-wechat.json

      - name: Offline end-to-end test
        run: python tests/test_offline.py

      - name: Portability and secrets scan
        run: python tests/test_portability.py
